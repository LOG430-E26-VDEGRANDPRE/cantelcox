  schemas:
    DetectionFraudePayload:
      type: object
      description: Audit Event API v1
      required: [eventType, eventTime, correlationId, domain, event, party]
      properties:
        eventType:
          type: string
          enum: [sim-swap, identite]
          description: Type de fraude.
        eventTime:
          type: string
          format: date-time
        domain:
          type: string
        description:
          type: string
        priority:
          type: string
          example: "2"
        timeOccurred:
          type: string
          format: date-time
        partyRef:
          type: string
        MSISDN:
          type: string
    AbusUsagePayload:
      type: object
      description: Audit Event API v1
      required: [usageType, eventTime, correlationId, subscriberRef, MSISDN]
      properties:
        usageType:
          type: string
          enum: [SMS, data, voice]
          description: Type d'abus d'usage
        eventTime:
          type: string
          format: date-time
        subscriberRef:
          type: string
        MSISDN:
          type: string
        timeOccurred:
          type: string
          format: date-time
    OfferingsVerifiedPayload:
      type: object
      required: [orderId, productOfferings]
      properties:
        productOfferings:
          type: object
          description: Offres validées avec leur détail
          required: [name, code, offeringType]
          properties:
            name:
              type: string
            code:
              type: string
            description:
              type: string
            offeringType:
              enum: [produit, service]
        orderId:
          type: integer
          description: Référence à la commande
    OfferingsInvalidPayload:
      type: object
      required: [orderId]
      properties:
        invalidproductofferings:
          type: array
          description: Codes des offres invalides
        orderId:
          type: integer
          description: Référence à la commande
    StockPayload:
      type: object
      required: [orderId]
      properties:
        affectedProductOfferings:
          type: object
          description: Structure d'offres avec les quantités restantes de stock
          properties:
            productOfferingRef:
              type: string
            quantity_after:
              type: integer
        orderId:
          type: integer
          description: Référence à la commande
    OrderSagaSubmittedPayload:
      type: object
      required: [userId]
      properties:
        timeSubmitted:
          type: string
          format: date-time
        order:
          $ref: '#/components/schemas/OrderPayload'
    OrderValidationsPayload:
      type: object
      required: [orderId]
      properties:
        orderId:
          type: integer
        validation:
          type: string
          enum: [OK, KO]
    DoProvisionActionsPayload:
      type: object
      required: [orderId, MSISDN]
      properties:
        orderId:
          type: integer
        MSISDN:
          type: string
          description: Numéro mobile du service
    DoInvoicingPayload:
      type: object
      required: [orderId, billCycleType]
      properties:
        orderId:
          type: integer
        billCycleType:
          type: string
          enum: [mensuel, ponctuel]
          description: Type de cycle de facturation
    OrderSagaEndedPayload:
      type: object
      required: [status, orderId]
      properties:
        status:
          type: string
        activation:
          type: object
          description: Détail de l'activation
          properties:
            lines:
              type: object
            status:
              type: string
        customerbillId:
          type: integer
        orderId:
          type: integer
        paymentLink:
          type: string
    BuyerValidationPayload:
      type: object
      required: [partyRef, orderId]
      properties:
        partyRef:
          type: string
        orderId:
          type: integer
        validation:
          type: string
          enum: [OK, KO]
    PartyIdentifiedPayload:
      type: object
      required: [partyRef]
      properties:
        partyRef:
          type: string
        identificationTime:
          type: string
          format: date-time
        validation:
          type: string
          enum: [OK, KO]
    OrderStatePayload:
      type: object
      required: [order, orderState]
      properties:
        orderState:
          type: string
          enum: [draft, created, cancelled]
        timeOccured:
          type: string
          format: date-time
        order:
          $ref: '#/components/schemas/OrderPayload'
    OrderPayload:
      type: object
